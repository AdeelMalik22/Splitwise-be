# Production stack for a single server (e.g. AWS EC2): Caddy (HTTPS) -> Django -> PostgreSQL.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-splitwise}
      POSTGRES_USER: ${POSTGRES_USER:-splitwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splitwise} -d ${POSTGRES_DB:-splitwise}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-splitwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-splitwise}
    # Migrate and create the cache table on every start, then serve.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             exec gunicorn splitwise.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
